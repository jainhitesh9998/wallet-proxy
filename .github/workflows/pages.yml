name: Documentation site

# Builds the guides, the REST API reference (OpenAPI), the TypeScript API (TypeDoc) and the Java API (Javadoc) and
# publishes them to GitHub Pages. One-time setup: Settings > Pages > Source: "GitHub Actions".
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '**/README.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - 'mkdocs.yml'
      - 'typedoc.json'
      - 'scripts/build-site.sh'
      - 'scripts/site-pages.mjs'
      - 'packages/*/src/**'
      - 'trust-server/**/src/main/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install mkdocs-material==9.5.49
      - run: npm ci
      - run: scripts/build-site.sh site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
