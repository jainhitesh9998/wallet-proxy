name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  service:
    name: Trust service (Java)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Unit and integration tests; EvaluationVectorsTest fails when conformance/evaluation/vectors.json is stale.
      - run: mvn --batch-mode --no-transfer-progress verify 2>&1 | tee "$RUNNER_TEMP/build.log"
        shell: bash
        working-directory: trust-server
      - name: Report what failed
        if: failure()
        run: scripts/ci-report-failures.sh trust-server "$RUNNER_TEMP/build.log"

  packages:
    name: Client library, reference ecosystem, wallet core (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build -w @vctrust/trust-client -w @vctrust/wallet-core
      - run: npm run typecheck --workspaces --if-present
      - run: npm test -w @vctrust/trust-client
      - run: npm test -w @vctrust/reference-ecosystem
      # Includes the wallet against the reference issuer and verifier, started as a child process.
      - run: npm test -w @vctrust/wallet-core
