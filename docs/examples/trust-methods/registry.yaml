# The registry that docs/trust-methods.md walks through: one party per trust method, on the test PKI of conformance/pki.
# Locations are relative to the directory the service is started in (the repository root).
entities:
  # Found through its own CA: the anchor below names it (entity: utopia-dmv).
  - id: utopia-dmv
    roles: [CREDENTIAL_ISSUER]
    name: Utopia DMV
    identifiers:
      - { type: URL, value: "https://issuer.utopia.example" }
    authorizations:
      - { format: mso_mdoc, type: org.iso.18013.5.1.mDL }

  # Found through its DID: credentials signed with a key of this DID are this party's.
  - id: example-university
    roles: [CREDENTIAL_ISSUER]
    name: Example University
    identifiers:
      - did:key:z6MkhaXgBZDvotDkL5257faiztiGiC2QtKLGpbnnEGta2doK
    authorizations:
      - { format: ldp_vc, type: UniversityDegreeCredential }

  # Found through its own CA, in the trust domain of the national-id mechanism (application.yml).
  - id: utopia-nation
    roles: [CREDENTIAL_ISSUER]
    name: Utopia Nation
    authorizations:
      - { format: mso_mdoc, type: org.example.id.card }

  # Found through a name in its certificate: the CA below is shared by many verifiers.
  - id: verifier-inc
    roles: [VERIFIER]
    name: Verifier Inc
    identifiers:
      - { type: DNS, value: verifier.example }

anchors:
  # An IACA: the root of mdoc Document Signer certificates, here for one doctype, with a CRL pushed by the operator.
  - id: utopia-iaca
    domain: mdoc-iaca
    entity: utopia-dmv
    certificateLocation: conformance/pki/iaca.pem
    constraints:
      docTypes: [org.iso.18013.5.1.mDL]
      # conformance/pki/iaca.crl as base64. In production: crlUrls: ["https://pki.example.org/iaca.crl"]
      crl: ""

  # A CA that issues access certificates to verifiers. No entity: a chain to it says the certificate is valid, not whose it is.
  - id: rp-access-ca
    domain: verifier-access
    certificateLocation: conformance/pki/rp-ca.pem

  # A root for issuers that sign SD-JWT VCs with an x5c chain; it has an intermediate CA below it.
  - id: issuer-root
    domain: credential-issuer
    certificateLocation: conformance/pki/rsa-root.pem

  # The national ID CA: an anchor of a domain of the operator's naming, which only the national-id mechanism counts.
  - id: national-id-ca
    domain: national-id
    entity: utopia-nation
    certificateLocation: conformance/pki/nid-ca.pem
    constraints:
      # conformance/pki/nid-ca.crl as base64: it revokes nothing.
      crl: ""
