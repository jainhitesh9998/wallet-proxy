# Wallet proxy (trust service) — default (demo) configuration.
# Frameworks group trust information; sources feed them; clients see only the frameworks they accept.
server:
  port: 8090
  # Forwarded headers are not believed: anyone can send them. Behind a reverse proxy, list it in
  # trust.auth.trusted-proxies (and trust.auth.mtls.trusted-proxies for a client-certificate header) instead.
  # The service's own URLs come from trust.service.issuer, not from the request.
  forward-headers-strategy: none

spring:
  application:
    name: wallet-proxy
  datasource:
    url: jdbc:h2:file:./data/trust;MODE=PostgreSQL
    username: sa
    password: ""
  sql:
    init:
      mode: always
  jackson:
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      # The health endpoint is public, for probes: it says UP or DOWN. What is behind that (sources and their errors,
      # the database, the disk) is for operators: GET /admin/v1/sources, or set this to "always" on a private network.
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    io.vctrust: INFO

trust:
  service:
    issuer: http://localhost:8090
    signing-key-file: ./data/signing-key.jwk
    # Production: a keystore or an HSM, and the retired key's public JWK while clients rotate.
    # signing-key:
    #   type: pkcs11                            # or keystore (keystore, keystore-type, password, alias)
    #   pkcs11-config: /etc/trust/pkcs11.cfg
    #   pin: ${TRUST_HSM_PIN}
    #   alias: trust-service-2026
    #   previous-keys: [/etc/trust/trust-service-2025.pub.jwk]
    decision-ttl: PT1H
    snapshot-ttl: PT24H
  http:
    connect-timeout: PT5S
    read-timeout: PT15S
    allow-private-networks: false
  revocation:
    # Trust anchor CRLs ship in snapshots; devices check them (and CRLs of intermediates) themselves.
    refresh: PT1H
    snapshot-max-crl-bytes: 262144
    fetch-on-demand: true
    relay-crls: true
    relay-status-lists: true
  cache:
    # One policy for everything the proxy fetches: shared loads, short memory for failures, stale-on-error.
    metadata-max-ttl: PT1H
    did-ttl: PT15M
    context-ttl: PT24H
    negative-ttl: PT30S
    stale-if-error: PT24H
    max-bytes: 33554432
  did:
    # did:key, did:jwk and did:web are resolved natively. Other methods: a registry URL template per method
    # (below), or a Universal Resolver (universal-resolver-url; none is contacted unless configured).
    registries:
      ebsi: https://api-pilot.ebsi.eu/did-registry/v5/identifiers/{did}
  auth:
    api-keys: true                              # development; production uses the methods below and sets this to false
    # Production: OAuth 2.0 JWT access tokens and/or TLS client certificates.
    # oauth:
    #   enabled: true
    #   issuer: https://login.example.com/realms/trust
    #   jwks-uri: https://login.example.com/realms/trust/protocol/openid-connect/certs
    #   required-scope: trust.read
    # mtls:
    #   enabled: true
    #   certificate-header: X-SSL-Client-Cert    # set by the TLS-terminating proxy
    #   trusted-proxies: [10.0.0.0/8]
    rate-limit: { enabled: true, requests-per-minute: 600, burst: 100 }
  # Requests without credentials are refused. To serve the public: anonymous: { enabled: true, frameworks: [...] }

  # No clients, frameworks or sources are configured here: until an operator lists them, every API request is refused
  # and the registry is empty. The demo configuration (clients with well-known API keys, the Animo playground, the
  # reference ecosystem) is the "demo" profile, application-demo.yml: --spring.profiles.active=demo. Never in production.
