# Wallet proxy (trust service) — default (demo) configuration.
# Frameworks group trust information; sources feed them; clients see only the frameworks they accept.
server:
  port: 8090
  # Forwarded headers are not believed: anyone can send them. Behind a reverse proxy, list it in
  # trust.auth.trusted-proxies (and trust.auth.mtls.trusted-proxies for a client-certificate header) instead.
  # The service's own URLs come from trust.service.issuer, not from the request.
  forward-headers-strategy: none

spring:
  application:
    name: wallet-proxy
  datasource:
    url: jdbc:h2:file:./data/trust;MODE=PostgreSQL
    username: sa
    password: ""
  sql:
    init:
      mode: always
  jackson:
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    io.vctrust: INFO

trust:
  service:
    issuer: http://localhost:8090
    signing-key-file: ./data/signing-key.jwk
    # Production: a keystore or an HSM, and the retired key's public JWK while clients rotate.
    # signing-key:
    #   type: pkcs11                            # or keystore (keystore, keystore-type, password, alias)
    #   pkcs11-config: /etc/trust/pkcs11.cfg
    #   pin: ${TRUST_HSM_PIN}
    #   alias: trust-service-2026
    #   previous-keys: [/etc/trust/trust-service-2025.pub.jwk]
    decision-ttl: PT1H
    snapshot-ttl: PT24H
  http:
    connect-timeout: PT5S
    read-timeout: PT15S
    allow-private-networks: false
  revocation:
    # Trust anchor CRLs ship in snapshots; devices check them (and CRLs of intermediates) themselves.
    refresh: PT1H
    snapshot-max-crl-bytes: 262144
    fetch-on-demand: true
    relay-crls: true
    relay-status-lists: true
  cache:
    # One policy for everything the proxy fetches: shared loads, short memory for failures, stale-on-error.
    metadata-max-ttl: PT1H
    did-ttl: PT15M
    context-ttl: PT24H
    negative-ttl: PT30S
    stale-if-error: PT24H
    max-bytes: 33554432
  did:
    # did:key, did:jwk and did:web are resolved natively. Other methods: a registry URL template per method
    # (below), or a Universal Resolver (universal-resolver-url; none is contacted unless configured).
    registries:
      ebsi: https://api-pilot.ebsi.eu/did-registry/v5/identifiers/{did}
  auth:
    api-keys: true                              # the demo clients below use API keys
    # Production: OAuth 2.0 JWT access tokens and/or TLS client certificates.
    # oauth:
    #   enabled: true
    #   issuer: https://login.example.com/realms/trust
    #   jwks-uri: https://login.example.com/realms/trust/protocol/openid-connect/certs
    #   required-scope: trust.read
    # mtls:
    #   enabled: true
    #   certificate-header: X-SSL-Client-Cert    # set by the TLS-terminating proxy
    #   trusted-proxies: [10.0.0.0/8]
    rate-limit: { enabled: true, requests-per-minute: 600, burst: 100 }
  # Requests without credentials are refused. To serve the public: anonymous: { enabled: true, frameworks: [...] }

  # A client sees the frameworks it names ("*" for all) and nothing else.
  clients:
    - id: demo-wallet
      name: Demo wallet
      api-key: demo-wallet-key
      frameworks: [animo-playground, reference, local]
    - id: demo-verifier
      name: Demo verifier
      api-key: demo-verifier-key
      frameworks: [animo-playground, reference, local]
      strict-authorization: true
      require-revocation-status: true
    - id: admin
      name: Operator
      api-key: admin-key
      admin: true

  frameworks:
    - id: animo-playground
      name: Animo OpenID4VC Playground
      description: Credo-based EUDI-style playground issuers and verifier (mdoc / SD-JWT VC, HAIP features)
      governance-uri: https://playground.animo.id
    - id: reference
      name: Reference ecosystem
      description: The local reference issuer and verifier (test-ecosystem/), registered through the admin API
    - id: local
      name: Locally managed
      description: Entities and anchors maintained through the admin API
    - id: eu-lotl
      name: EU List of Trusted Lists
      governance-uri: https://ec.europa.eu/tools/lotl/eu-lotl.xml
    - id: ebsi-pilot
      name: EBSI pilot network
      governance-uri: https://api-pilot.ebsi.eu

  # A source is required unless it says otherwise: no snapshot is served until every required source has loaded.
  sources:
    - id: demo-registry
      type: static
      framework: animo-playground
      refresh: PT1H
      properties:
        location: classpath:trust/demo-registry.yaml
    # What the playground's issuers say about themselves (display names, JSON-LD contexts). It describes the entity
    # registered above and grants nothing; the sandbox being down does not hold the service back.
    - id: animo-issuers
      type: oid4vci-discovery
      framework: animo-playground
      required: false
      refresh: PT30M
      properties:
        issuers:
          - url: https://playground.animo.id/oid4vci/b39e71cf-9cf1-4723-a9cd-66f42a510b36
            entityId: animo-playground
    # Entities and anchors added at run time: PUT /admin/v1/managed/{entities|anchors}/{id}.
    - id: managed
      type: managed
      framework: local
      refresh: PT5M
    # Real-world lists, off by default (large, network heavy). A list is loaded only when its signature verifies
    # against pinned signer certificates.
    - id: eu-lotl
      type: etsi-tl
      framework: eu-lotl
      enabled: false
      refresh: PT12H
      properties:
        location: https://ec.europa.eu/tools/lotl/eu-lotl.xml
        # signerCertificates: [classpath:trust/certs/eu-lotl-signer.pem]   # from the Official Journal of the EU
        territories: [AT, BE]
        includeAllServiceTypes: false
    # Asked on demand about did:ebsi issuers that are in no snapshot.
    - id: ebsi-pilot
      type: ebsi-tir
      framework: ebsi-pilot
      required: false
      refresh: PT12H
      properties:
        baseUrl: https://api-pilot.ebsi.eu/trusted-issuers-registry/v5
        crawl: false
