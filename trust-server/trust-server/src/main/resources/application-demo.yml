# The demo configuration: --spring.profiles.active=demo (scripts/start-trust-server.sh and scripts/dev-up.sh use it).
#
# NOT FOR PRODUCTION. The API keys below are published in this repository, the admin key included: anyone who can
# reach a service running this profile can read its registry and change what it trusts.
trust:
  # A client sees the frameworks it names ("*" for all) and nothing else.
  clients:
    - id: demo-wallet
      name: Demo wallet
      api-key: demo-wallet-key
      frameworks: [animo-playground, reference, local]
    - id: demo-verifier
      name: Demo verifier
      api-key: demo-verifier-key
      frameworks: [animo-playground, reference, local]
      strict-authorization: true
      require-revocation-status: true
    - id: admin
      name: Operator
      api-key: admin-key
      admin: true

  frameworks:
    - id: animo-playground
      name: Animo OpenID4VC Playground
      description: Credo-based EUDI-style playground issuers and verifier (mdoc / SD-JWT VC, HAIP features)
      governance-uri: https://playground.animo.id
    - id: reference
      name: Reference ecosystem
      description: The local reference issuer and verifier (test-ecosystem/), registered through the admin API
    - id: local
      name: Locally managed
      description: Entities and anchors maintained through the admin API
    - id: eu-lotl
      name: EU List of Trusted Lists
      governance-uri: https://ec.europa.eu/tools/lotl/eu-lotl.xml
    - id: ebsi-pilot
      name: EBSI pilot network
      governance-uri: https://api-pilot.ebsi.eu

  # A source is required unless it says otherwise: no snapshot is served until every required source has loaded.
  sources:
    - id: demo-registry
      type: static
      framework: animo-playground
      refresh: PT1H
      properties:
        location: classpath:trust/demo-registry.yaml
    # What the playground's issuers say about themselves (display names, JSON-LD contexts). It describes the entity
    # registered above and grants nothing; the sandbox being down does not hold the service back.
    - id: animo-issuers
      type: oid4vci-discovery
      framework: animo-playground
      required: false
      refresh: PT30M
      properties:
        issuers:
          - url: https://playground.animo.id/oid4vci/b39e71cf-9cf1-4723-a9cd-66f42a510b36
            entityId: animo-playground
    # Entities and anchors added at run time: PUT /admin/v1/managed/{entities|anchors}/{id}. A managed source loads
    # the entries written for its framework (an entry names it with "framework"; the first managed source is the default).
    - id: managed
      type: managed
      framework: local
      refresh: PT5M
    # The reference issuer and verifier (scripts/register-reference.mjs writes them with framework: reference).
    - id: managed-reference
      type: managed
      framework: reference
      refresh: PT5M
    # Real-world lists, off by default (large, network heavy). A list is loaded only when its signature verifies
    # against pinned signer certificates.
    - id: eu-lotl
      type: etsi-tl
      framework: eu-lotl
      enabled: false
      refresh: PT12H
      properties:
        location: https://ec.europa.eu/tools/lotl/eu-lotl.xml
        # signerCertificates: [classpath:trust/certs/eu-lotl-signer.pem]   # from the Official Journal of the EU
        territories: [AT, BE]
        includeAllServiceTypes: false
    # Asked on demand about did:ebsi issuers that are in no snapshot.
    - id: ebsi-pilot
      type: ebsi-tir
      framework: ebsi-pilot
      required: false
      refresh: PT12H
      properties:
        baseUrl: https://api-pilot.ebsi.eu/trusted-issuers-registry/v5
        crawl: false
