# Curated demo registry (source type "static"). An entry here is the operator's statement that a party is trusted,
# under which identifiers, and for which credential types. Identifiers are written exactly as the party writes them:
# they are compared byte for byte.
entities:
  # Animo's OpenID4VC playground: two issuer tenants and a verifier on one host, all signing with one leaf certificate.
  - id: animo-playground
    framework: animo-playground
    roles: [CREDENTIAL_ISSUER, VERIFIER]
    display:
      - {locale: en, name: "Animo Playground", logoUri: "https://playground.animo.id/assets/issuers/utopia/issuer.png"}
    identifiers:
      - {type: URL, value: "https://playground.animo.id/oid4vci/b39e71cf-9cf1-4723-a9cd-66f42a510b36"}   # issuer "Utopia"
      - {type: URL, value: "https://playground.animo.id/oid4vci/188e2459-6da8-4431-9062-2fcdac274f41"}   # issuer "Bundesdruckerei"
      - {type: URL, value: "https://playground.animo.id"}                                                 # verifier origin (DC API)
      - {type: DNS, value: playground.animo.id}                                                           # the certificate's SAN
    authorizations:
      - {format: mso_mdoc}
      - {format: dc+sd-jwt}

anchors:
  # The playground's root: IACA for its mdocs, CA of its SD-JWT VC signer and of its verifier certificate. Pinned
  # here; refresh with: curl -s https://playground.animo.id/api/x509 | jq -r .pem
  # SHA-256 52:51:6F:78:B7:1F:31:B2:A9:9E:A1:2D:EF:A1:3D:BA:C6:84:DA:E2:A3:A1:47:87:35:F7:92:A5:A6:FE:5E:85
  - id: animo-playground-iaca
    domain: mdoc-iaca
    framework: animo-playground
    entity: animo-playground
    certificateLocation: classpath:trust/certs/animo-playground-root.pem
  - id: animo-playground-issuer-ca
    domain: credential-issuer
    framework: animo-playground
    entity: animo-playground
    certificateLocation: classpath:trust/certs/animo-playground-root.pem
  - id: animo-playground-verifier-ca
    domain: verifier-access
    framework: animo-playground
    entity: animo-playground
    certificateLocation: classpath:trust/certs/animo-playground-root.pem
